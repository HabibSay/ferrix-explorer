name: Tranche 2 validation

# `push` is present only so GitHub registers the workflow_dispatch trigger
# correctly (actions/runner#4001 turns dispatch-only workflows into
# push-only ones); the paths filter plus the job guard below keep pushes
# inert unless this very file changes.
on:
  push:
    paths:
      - '.github/workflows/tranche2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: Record runner OS build (for the validation doc)
        shell: bash
        run: cmd //c ver

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # The access_denied fixture is bypassed when SeBackupPrivilege is
      # enabled in the test process; these probes locate where the
      # validation job's token differs from CI's (shell vs recycle step).
      - name: Probe privileges (pwsh, before recycle)
        shell: pwsh
        run: whoami /priv | Select-String 'SeBackupPrivilege|SeRestorePrivilege'

      - name: Probe privileges (bash, before recycle)
        shell: bash
        run: whoami /priv | grep -E 'SeBackupPrivilege|SeRestorePrivilege'

      - name: 'Recycle bin / clipboard suites (ignored: touch the real Recycle Bin and clipboard)'
        shell: bash
        run: |
          cargo test -p fx-shell --test recycle_bin -- --ignored --test-threads=1 \
            2>&1 | tee validation-recycle-bin.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: Probe privileges (bash, after recycle)
        shell: bash
        run: whoami /priv | grep -E 'SeBackupPrivilege|SeRestorePrivilege'

      - name: Probe privileges (pwsh, after recycle)
        shell: pwsh
        run: whoami /priv | Select-String 'SeBackupPrivilege|SeRestorePrivilege'

      - name: Full workspace gate
        shell: bash
        run: |
          cargo test --workspace --all-targets --no-fail-fast \
            2>&1 | tee validation-workspace.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tranche-2-validation-evidence
          path: validation-*.txt
          if-no-files-found: error
